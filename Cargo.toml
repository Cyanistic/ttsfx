[package]
name = "ttsfx"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["http2", "query"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = { version = "0.15", features = ["toml"] }

# Error handling: thiserror for std::Error impl, color_eyre (optional) for backtraces
thiserror = "2"
color-eyre = { version = "0.6", features = ["capture-spantrace"] }
tracing = "0.1"

# Audio: all decode/encode via ffmpeg subprocess
futures-util = { version = "0.3", features = ["std"] }

# Pattern matching (fancy-regex for lookaheads/advanced features)
fancy-regex = "0.18"

# Cache directory watching (notify crate)
notify = { version = "8", features = ["serde"] }
# String distance for cache matching
strsim = "0.11"
serde_with = { version = "3.21.0", features = ["base64"] }
fastrand = "2.4.1"
tracing-subscriber = "0.3"
rayon = "1.12.0"
blake3 = "1.8.5"
