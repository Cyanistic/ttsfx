# Built-in sound effect pattern filters.
# Edit this file to add/remove/override patterns without recompiling.

[overridable]
match_mode = { mode = "embeddings", threshold = 0.92 }
embed_base_url = "http://127.0.0.1:11434/v1"
embed_model = "nomic-embed-text"
embed_api_key = ""
tts_base_url = "http://192.168.1.253:8880/v1"
sfx_base_url = "https://api.elevenlabs.io"
sfx_api_key = { env = "ELEVENLABS_API_KEY" }
# ElevenLabs sound-generation output_format (mp3, wav_48000, …). Must be a container ffmpeg can read.
sfx_output_format = "mp3_44100_128"
# SFX level after RMS match to speech: 0 = same loudness, negative = quieter (default in code is -16 if unset)
volume_target_db = 0
# crossfade_ms = 12   # default at SFX joins; 0 = hard join
context = { mode = "sentences", before = 1, after = 1 }
# Recipe → ElevenLabs + embeddings. Vars: text, context, name, tags
sfx_prompt_template = "\"{{ text }}\"{% if context %} — {{ context }}{% endif %}. Invent a creative sound for this moment. Keep it short and tight: end when the effect ends, no long reverb, no trailing silence."
# sfx_duration_seconds = 2.0   # omit to let ElevenLabs choose length from the prompt
# match_mode threshold: lower levenshtein / higher embedding cosine = stricter cache (more regen)
# match_mode = { mode = "levenshtein", threshold = 1 }

[[patterns]]
name = "boom"
priority = 100
regex = "\\b(?:BOOM|Boom)\\b"
# cache_tag = "impact"   # lookup scope per pattern (default: default)
# tags = ["loud"]        # recipe template only; not in [overridable] or overrides
# [patterns.overrides]
# crossfade_ms = 20

[[patterns]]
name = "crash"
priority = 100
regex = "\\b(?:CRASH|Crash)\\b"

[[patterns]]
name = "whoosh"
priority = 90
regex = "\\b(?:WHOOSH|Whoosh)\\b"

[[patterns]]
name = "zap"
priority = 90
regex = "\\b(?:ZAP|Zap)\\b"

[[patterns]]
name = "splat"
priority = 80
regex = "\\b(?:SPLAT|Splat)\\b"

[[patterns]]
name = "clap"
priority = 80
regex = "\\b(?:CLAP|Clap)\\b"

[[patterns]]
name = "thud"
priority = 70
regex = "\\b(?:THUD|Thud)\\b"

[[patterns]]
name = "ding"
priority = 70
regex = "\\b(?:DING|Ding)\\b"

[[patterns]]
name = "sizzle"
priority = 60
regex = "\\b(?:SIZZLE|Sizzle)\\b"

[[patterns]]
name = "pop"
priority = 60
regex = "\\b(?:POP|Pop)\\b"
