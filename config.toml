# Built-in sound effect pattern filters.
# Edit this file to add/remove/override patterns without recompiling.

[[patterns]]
id = "boom"
priority = 100
regex = "\\b(?:BOOM|Boom)\\b"

[[patterns]]
id = "crash"
priority = 100
regex = "\\b(?:CRASH|Crash)\\b"

[[patterns]]
id = "whoosh"
