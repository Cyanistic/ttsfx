# Built-in sound effect pattern filters.
# Edit this file to add/remove/override patterns without recompiling.

[overridable]
match_mode = { mode = "Levenshtein", threshold = 1 }
tts_base_url = "https://api.openai.com/v1"
sfx_base_url = "https://api.elevenlabs.io"
# ElevenLabs sound-generation output_format (mp3, wav_48000, …). Must be a container ffmpeg can read.
sfx_output_format = "mp3"

[[patterns]]
name = "boom"
priority = 100
regex = "\\b(?:BOOM|Boom)\\b"

[[patterns]]
name = "crash"
priority = 100
regex = "\\b(?:CRASH|Crash)\\b"

[[patterns]]
name = "whoosh"
priority = 90
regex = "\\b(?:WHOOSH|Whoosh)\\b"

[[patterns]]
name = "zap"
priority = 90
regex = "\\b(?:ZAP|Zap)\\b"

[[patterns]]
name = "splat"
priority = 80
regex = "\\b(?:SPLAT|Splat)\\b"

[[patterns]]
name = "clap"
priority = 80
regex = "\\b(?:CLAP|Clap)\\b"

[[patterns]]
name = "thud"
priority = 70
regex = "\\b(?:THUD|Thud)\\b"

[[patterns]]
name = "ding"
priority = 70
regex = "\\b(?:DING|Ding)\\b"

[[patterns]]
name = "sizzle"
priority = 60
regex = "\\b(?:SIZZLE|Sizzle)\\b"

[[patterns]]
name = "pop"
priority = 60
regex = "\\b(?:POP|Pop)\\b"
